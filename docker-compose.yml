services:
    postgresql:
        image: postgres:16
        container_name: postgres_sisdash
        restart: always
        ports:
            - 5434:5432
        environment:
            POSTGRES_PASSWORD: ${PG_PASS}
            POSTGRES_USER: ${PG_USER}
            POSTGRES_DB: ${PG_DB}
        volumes:
            - /var/cache/pgdata:/var/lib/postgresql/data
        healthcheck:
            # O container "start" quase instantâneo, mas o Postgres em si
            # ainda leva um instante pra aceitar conexões — sem isso, quem
            # depende deste serviço (api, migrations no CI) pode tentar
            # conectar cedo demais e cair em "Connection refused".
            test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
            interval: 2s
            timeout: 3s
            retries: 15

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_sisdash
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASS}
        ports:
            - 5050:80
        depends_on:
            - postgresql

    api:
        container_name: api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8002:8000"
        environment:
            PGHOST: postgresql
            POSTGRES_PASSWORD: ${PG_PASS}
            POSTGRES_USER: ${PG_USER}
            POSTGRES_DB: ${PG_DB}
            # Antes eram lidas só via auto-load do pipenv a partir do .env
            # local (funciona em dev, mas silenciosamente vazio em CI onde
            # não existe .env — passá-las explícito faz elas virem de
            # qualquer .env local OU de env vars exportadas no shell/CI).
            DATABASE_URL: ${DATABASE_URL}
            SECRET_KEY: ${SECRET_KEY}
            ALGORITHM: ${ALGORITHM}
        volumes:
            - .:/app
        depends_on:
            postgresql:
                condition: service_healthy
        command: pipenv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
  